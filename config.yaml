provider: claude-code          # claude-code | anthropic | codex | openai-compatible | offline
                               # env override: COSCIENTIST_PROVIDER

anthropic:
  model_strong: claude-opus-4-7
  model_fast: claude-sonnet-4-6

claude_code:
  model_strong: opus
  model_fast: sonnet

codex:                         # ChatGPT subscription via `codex login`
  model: gpt-5.1-codex
  effort_strong: high
  effort_fast: medium

openai_compatible:             # any server implementing POST /v1/chat/completions
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY  # set null for a local server that needs no auth
  model_strong: gpt-5
  model_fast: gpt-5-mini
  timeout_seconds: 60

offline:                       # deterministic in-process fixture: no network, no cost,
  seed: 0                      # no credentials. Exercises the pipeline, NOT the science.

supervisor:
  n_workers: 4
  tick_interval_seconds: 10
  checkpoint_interval: 5
  max_time_minutes: 30
  min_hypothesis_count: 8
  elo_variance_threshold: 5000
  meta_review_interval: 20

tournament:
  elo_initial: 1200.0
  elo_k_factor: 48.0          # faster Elo movement → wider spread for concordance (was 32)
  multi_turn_threshold: 1500.0   # keep most eval matches single-turn/cheap (was 1350)
  max_debate_turns: 10

proximity:
  model: all-MiniLM-L6-v2
  similarity_threshold: 0.5
  duplicate_threshold: 0.92

tools:
  search_provider: tavily
  max_search_results: 5

evidence:                      # claim verification during reflection
  max_claims: 4                # per hypothesis; each costs ~1 strong-model call
  concurrency: 2                # concurrent lookups per hypothesis (NCBI is 3 req/s)

db_path: coscientist.db
log_path: coscientist.log
